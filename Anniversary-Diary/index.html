<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Secret ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet">
</head>

<body class="password-page">

    <div class="password-card">

        <div class="lock-heart">
        
        </div>

        <p class="secret-label">
            A LITTLE SECRET
        </p>

        <h1>
            Just For You
            <span>My Love</span>
        </h1>

        <p class="password-message">
            This little diary contains memories,
            photographs and a piece of my heart.
        </p>

        <p class="password-hint">
            Only one special person knows the key... ❤️
        </p>

        <div class="password-box">

            <input
                type="password"
                id="secretPassword"
                placeholder="Enter our secret"
                autocomplete="off"
            >

            <button id="unlockButton">
                Unlock Our Story ❤️
            </button>

        </div>

        <p id="passwordError" class="password-error"></p>

        <div class="password-footer">
            Made with love ❤️
        </div>

    </div>
<script src="script.js"></script>

</body>

</html>
